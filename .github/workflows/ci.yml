name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-compile:
    name: Lint & dbt compile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write GCP keyfile from secret
        env:
          GCP_KEYFILE: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
        run: |
          echo "$GCP_KEYFILE" > /tmp/gcp_keyfile.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp_keyfile.json" >> $GITHUB_ENV
          # verify it's valid JSON
          python3 -c "import json; json.load(open('/tmp/gcp_keyfile.json')); print('keyfile JSON is valid')"

      - name: SQLFluff lint
        working-directory: dbt_project
        run: sqlfluff lint models

      - name: dbt deps
        working-directory: dbt_project
        run: dbt deps

      - name: dbt compile
        working-directory: dbt_project
        env:
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
          GCP_DATASET: ${{ vars.GCP_DATASET }}
        run: dbt compile --profiles-dir .