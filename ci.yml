name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-compile:
    name: Lint & dbt compile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: SQLFluff lint
        run: |
          sqlfluff lint dbt_project/models \
            --dialect duckdb \
            --templater dbt \
            --rules L001,L002,L003,L010,L014,L016,L019
        working-directory: .

      - name: dbt deps
        run: dbt deps
        working-directory: dbt_project

      - name: dbt compile (no warehouse needed)
        run: dbt compile --profiles-dir .
        working-directory: dbt_project
        env:
          DUCKDB_PATH: "/tmp/ci_test.duckdb"
